name: Normalize Bootloader Evidence Diff V4

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootloader-evidence
          fetch-depth: 0
      - name: Restore original structure and patch evidence
        run: python .github/scripts/normalize_bootloader_evidence.py
      - name: Verify tests
        run: python -m unittest discover -s tests -v
      - name: Commit normalized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: preserve portfolio source structure"
          git push origin HEAD:agent/bootloader-evidence
