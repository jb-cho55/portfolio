name: Finalize Portfolio Refinement

on:
  push:
    branches:
      - agent/portfolio-evidence-refinement

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, 'remove temporary refinement workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-evidence-refinement
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check local HTML asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing = []
          for html in Path('.').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for _, value in re.findall(r'(href|src)="([^"]+)"', text):
                  if value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  target = value.split('#', 1)[0]
                  if target and not (html.parent / target).resolve().exists():
                      missing.append(f'{html}: {value}')
          if missing:
              raise SystemExit('Missing local references:\n' + '\n'.join(missing))
          PY
      - name: Check temporary signed URL markers
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('index.html'), Path('artifacts'), Path('assets'), Path('docs/verification')]
          files = [roots[0]]
          for root in roots[1:]:
              files.extend(path for path in root.rglob('*') if path.is_file())
          forbidden = ('prod-files-' + 'secure.s3', 'X-' + 'Amz-')
          findings = []
          for path in files:
              if path.suffix.lower() not in {'.html', '.css', '.svg', '.md'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for marker in forbidden:
                  if marker in text:
                      findings.append(f'{path}: {marker}')
          if findings:
              raise SystemExit('Temporary signed URL markers found:\n' + '\n'.join(findings))
          PY
      - name: Remove temporary refinement workflow
        run: rm .github/workflows/apply-portfolio-refinement.yml
      - name: Commit workflow cleanup
        run: |
          git config user.name "portfolio-refinement-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary refinement workflow"
          git push origin HEAD:agent/portfolio-evidence-refinement
