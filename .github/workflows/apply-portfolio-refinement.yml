name: Apply Portfolio Refinement

on:
  push:
    branches:
      - agent/portfolio-evidence-refinement
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'apply portfolio evidence refinement') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-evidence-refinement
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Apply ID-based changes
        run: python .github/scripts/apply_portfolio_refinement.py
      - name: Align legacy tests and report copy
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_portfolio.py')
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              'self.assertIn("AURIX 기반 ECU 기능 구현", self.html)': 'self.assertIn("국민대학교 자동차IT융합학과와 HL만도·HL클레무브 부트캠프", self.html)',
              'self.assertIn("CANoe/CAPL 기반 차량 SW 검증", self.html)': 'self.assertIn("차량 HW·SW 전반의 전문지식", self.html)',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'legacy assertion count for {old}: {text.count(old)}')
              text = text.replace(old, new, 1)
          test_path.write_text(text, encoding='utf-8')

          report_path = Path('docs/verification/2026-07-27-portfolio-refinement.md')
          report = report_path.read_text(encoding='utf-8')
          old_report_line = '- `prod-files-secure.s3` and `X-Amz-` repository text scan'
          if report.count(old_report_line) != 1:
              raise SystemExit(f'report security line count: {report.count(old_report_line)}')
          report_path.write_text(
              report.replace(old_report_line, '- Temporary signed URL marker scan', 1),
              encoding='utf-8',
          )
          PY
      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v > /tmp/test-output.txt 2>&1
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-refinement-test-output
          path: /tmp/test-output.txt
          if-no-files-found: error
      - name: Stop on test failure
        if: steps.tests.outcome == 'failure'
        run: |
          cat /tmp/test-output.txt
          exit 1
      - name: Check local HTML asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing = []
          for html in Path('.').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for _, value in re.findall(r'(href|src)="([^"]+)"', text):
                  if value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  target = value.split('#', 1)[0]
                  if target and not (html.parent / target).resolve().exists():
                      missing.append(f'{html}: {value}')
          if missing:
              raise SystemExit('Missing local references:\n' + '\n'.join(missing))
          PY
      - name: Check expiring URLs in public artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('index.html'), Path('artifacts'), Path('assets'), Path('docs/verification')]
          files = [roots[0]]
          for root in roots[1:]:
              files.extend(path for path in root.rglob('*') if path.is_file())
          forbidden = ('prod-files-' + 'secure.s3', 'X-' + 'Amz-')
          findings = []
          for path in files:
              if path.suffix.lower() not in {'.html', '.css', '.svg', '.md'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for marker in forbidden:
                  if marker in text:
                      findings.append(f'{path}: {marker}')
          if findings:
              raise SystemExit('Expiring URL markers found:\n' + '\n'.join(findings))
          PY
      - name: Remove one-time automation
        run: rm .github/scripts/apply_portfolio_refinement.py .github/workflows/apply-portfolio-refinement.yml
      - name: Commit applied changes
        run: |
          git config user.name "portfolio-refinement-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply portfolio evidence refinement"
          git push origin HEAD:agent/portfolio-evidence-refinement
