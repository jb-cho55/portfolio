name: Render Credential Evidence

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-evidence-refinement
          fetch-depth: 0
      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Render masked PDF first pages at 200 DPI
        run: |
          mkdir -p assets/evidence/fullsize
          for name in ivs_completion black_box_award exemplary_award information_processing_engineer istqb_ctfl; do
            pdftoppm -f 1 -l 1 -singlefile -r 200 -png "assets/evidence/${name}.pdf" "assets/evidence/fullsize/${name}"
          done
      - name: Update image links, tests, and records
        run: |
          python - <<'PY'
          from pathlib import Path

          names = [
              'ivs_completion',
              'black_box_award',
              'exemplary_award',
              'information_processing_engineer',
              'istqb_ctfl',
          ]

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          for name in names:
              old = f'href="assets/evidence/thumbnails/{name}.webp"'
              new = f'href="assets/evidence/fullsize/{name}.png"'
              if index.count(old) != 1:
                  raise SystemExit(f'index link count for {name}: {index.count(old)}')
              index = index.replace(old, new, 1)
          index_path.write_text(index, encoding='utf-8')

          test_path = Path('tests/test_portfolio.py')
          test = test_path.read_text(encoding='utf-8')
          for name in names:
              old = f'"assets/evidence/thumbnails/{name}.webp"'
              new = f'"assets/evidence/fullsize/{name}.png"'
              if test.count(old) != 2:
                  raise SystemExit(f'portfolio test path count for {name}: {test.count(old)}')
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')

          refinement_path = Path('tests/test_portfolio_refinement.py')
          refinement = refinement_path.read_text(encoding='utf-8')
          if refinement.count('import re\n') != 1:
              raise SystemExit('unexpected import block')
          refinement = refinement.replace('import re\n', 'import re\nimport struct\n', 1)
          old_image_line = 'image = ROOT / f"assets/evidence/thumbnails/{name}.webp"'
          new_image_line = 'image = ROOT / f"assets/evidence/fullsize/{name}.png"'
          if refinement.count(old_image_line) != 1:
              raise SystemExit(f'refinement image line count: {refinement.count(old_image_line)}')
          refinement = refinement.replace(old_image_line, new_image_line, 1)
          old_size_line = '            self.assertGreater(image.stat().st_size, 10_000)\n            self.assertIn(f\'href="assets/evidence/thumbnails/{name}.webp"\', self.index)'
          new_size_lines = '''            self.assertGreater(image.stat().st_size, 100_000)
            data = image.read_bytes()
            self.assertEqual(data[:8], b"\\x89PNG\\r\\n\\x1a\\n")
            width, height = struct.unpack(">II", data[16:24])
            self.assertGreaterEqual(min(width, height), 1100)
            self.assertGreaterEqual(max(width, height), 1600)
            self.assertIn(f'href="assets/evidence/fullsize/{name}.png"', self.index)'''
          if refinement.count(old_size_line) != 1:
              raise SystemExit(f'refinement size block count: {refinement.count(old_size_line)}')
          refinement = refinement.replace(old_size_line, new_size_lines, 1)
          refinement_path.write_text(refinement, encoding='utf-8')

          spec_path = Path('docs/superpowers/specs/2026-07-27-portfolio-evidence-refinement-design.md')
          spec = spec_path.read_text(encoding='utf-8')
          spec = spec.replace(
              '기존 마스킹 WebP 이미지를 확대 보기 자산으로 재사용한다.',
              '마스킹 PDF 첫 페이지를 200 DPI PNG로 렌더링해 확대 보기 자산으로 사용한다.',
          )
          spec = spec.replace(
              '자격·수상 확대 보기는 기존 `assets/evidence/thumbnails/*.webp`를 사용해 중복 자산을 만들지 않는다.',
              '자격·수상 확대 이미지는 `assets/evidence/fullsize/*.png`에 보관하고 기존 WebP는 카드 미리보기로 유지한다.',
          )
          spec_path.write_text(spec, encoding='utf-8')

          plan_path = Path('docs/superpowers/plans/2026-07-27-portfolio-evidence-refinement.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('- Reuse: `assets/evidence/thumbnails/*.webp`', '- Create: `assets/evidence/fullsize/*.png`')
          plan = plan.replace('- [ ] 기존 마스킹 WebP를 확대 보기 링크로 재사용한다.', '- [ ] 기존 마스킹 PDF 첫 페이지를 200 DPI PNG로 렌더링한다.')
          plan_path.write_text(plan, encoding='utf-8')

          verification_path = Path('docs/verification/2026-07-27-portfolio-refinement.md')
          verification = verification_path.read_text(encoding='utf-8')
          old_row = '| CREDENTIAL-01 | 기존 마스킹 WebP 이미지 존재·크기 확인 | PASS |'
          new_row = '| CREDENTIAL-01 | 마스킹 PDF 첫 페이지를 200 DPI PNG로 렌더링하고 최소 1100×1600 해상도 확인 | PASS |'
          if verification.count(old_row) != 1:
              raise SystemExit(f'verification row count: {verification.count(old_row)}')
          verification = verification.replace(old_row, new_row, 1)
          verification_path.write_text(verification, encoding='utf-8')
          PY
      - name: Verify PNG dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          for path in sorted(Path('assets/evidence/fullsize').glob('*.png')):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Not PNG: {path}')
              width, height = struct.unpack('>II', data[16:24])
              print(f'{path}: {width}x{height}, {path.stat().st_size} bytes')
              if min(width, height) < 1100 or max(width, height) < 1600:
                  raise SystemExit(f'Insufficient dimensions: {path}')
          PY
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Check local HTML references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing = []
          for html in Path('.').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for _, value in re.findall(r'(href|src)="([^"]+)"', text):
                  if value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  target = value.split('#', 1)[0]
                  if target and not (html.parent / target).resolve().exists():
                      missing.append(f'{html}: {value}')
          if missing:
              raise SystemExit('Missing references:\n' + '\n'.join(missing))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/render-credential-evidence.yml
      - name: Commit rendered evidence
        run: |
          git config user.name "portfolio-refinement-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: render fullsize credential evidence"
          git push origin HEAD:agent/portfolio-evidence-refinement
