name: Portfolio Refinement Verification

on:
  push:
    branches:
      - agent/portfolio-evidence-refinement
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check local HTML asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          missing = []
          for html in root.rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for _, value in re.findall(r'(href|src)="([^"]+)"', text):
                  if value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  target = value.split('#', 1)[0]
                  if target and not (html.parent / target).resolve().exists():
                      missing.append(f'{html}: {value}')
          if missing:
              raise SystemExit('Missing local references:\n' + '\n'.join(missing))
          PY
      - name: Check expiring URLs in public artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('index.html'), Path('artifacts'), Path('assets'), Path('docs/verification')]
          files = [roots[0]]
          for root in roots[1:]:
              files.extend(path for path in root.rglob('*') if path.is_file())
          forbidden = ('prod-files-' + 'secure.s3', 'X-' + 'Amz-')
          findings = []
          for path in files:
              if path.suffix.lower() not in {'.html', '.css', '.svg', '.md'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for marker in forbidden:
                  if marker in text:
                      findings.append(f'{path}: {marker}')
          if findings:
              raise SystemExit('Expiring URL markers found:\n' + '\n'.join(findings))
          PY
