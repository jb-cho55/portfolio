name: Portfolio Refinement Verification

on:
  push:
    branches:
      - agent/portfolio-evidence-refinement
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check local HTML asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          missing = []
          for html in root.rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for attr, value in re.findall(r'(href|src)="([^"]+)"', text):
                  if value.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  target = value.split('#', 1)[0]
                  if not target:
                      continue
                  resolved = (html.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f'{html}: {value}')
          if missing:
              raise SystemExit('Missing local references:\n' + '\n'.join(missing))
          PY
      - name: Check expiring URLs
        run: |
          if grep -R -n -E 'prod-files-secure\.s3|X-Amz-' --include='*.html' --include='*.css' --include='*.svg' --include='*.md' --include='*.py' .; then
            exit 1
          fi
