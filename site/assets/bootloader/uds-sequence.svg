<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="uds-title uds-desc">
<title id="uds-title">UDS reprogramming and restore sequence</title><desc id="uds-desc">Tester, BswCom, BswDcm, EcuAbsFls, FlsLoader, and PFlash sequence including services 0x10, 0x27, 0x31, 0x34, 0x36, 0x37, 0x11 and a SHA-256 mismatch restore branch.</desc>
<style>.lane{stroke:#9fb1c7;stroke-width:2}.h{font:700 18px Arial,sans-serif;fill:#0b1f3a}.m{font:14px Arial,sans-serif;fill:#33465d}.ok{stroke:#216fe6;stroke-width:3;marker-end:url(#b)}.fail{stroke:#b24a3a;stroke-width:3;marker-end:url(#r)}.box{fill:#edf4ff;stroke:#216fe6;rx:8}.fbox{fill:#fff0ec;stroke:#b24a3a;rx:8}</style><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#216fe6"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#b24a3a"/></marker></defs>
<g><text x="85" y="35" class="h">Tester</text><text x="270" y="35" class="h">BswCom</text><text x="455" y="35" class="h">BswDcm</text><text x="635" y="35" class="h">EcuAbsFls</text><text x="830" y="35" class="h">FlsLoader</text><text x="1050" y="35" class="h">PFlash</text></g>
<g class="lane"><line x1="110" y1="55" x2="110" y2="940"/><line x1="300" y1="55" x2="300" y2="940"/><line x1="490" y1="55" x2="490" y2="940"/><line x1="680" y1="55" x2="680" y2="940"/><line x1="875" y1="55" x2="875" y2="940"/><line x1="1080" y1="55" x2="1080" y2="940"/></g>
<g class="m"><line x1="110" y1="90" x2="490" y2="90" class="ok"/><text x="170" y="82">0x10 DiagnosticSessionControl</text><line x1="110" y1="145" x2="490" y2="145" class="ok"/><text x="190" y="137">0x27 SecurityAccess</text><line x1="110" y1="205" x2="490" y2="205" class="ok"/><text x="145" y="197">0x31 EA_AppToBackup()</text><line x1="490" y1="245" x2="680" y2="245" class="ok"/><text x="505" y="237">RTE call</text><line x1="680" y1="285" x2="875" y2="285" class="ok"/><text x="700" y="277">FlsLoader_Write()</text><line x1="875" y1="325" x2="1080" y2="325" class="ok"/><text x="905" y="317">Primary → Backup</text><line x1="110" y1="385" x2="490" y2="385" class="ok"/><text x="125" y="377">0x31 RID_EraseMemory / RCOR_EraseMemory_App</text><line x1="110" y1="445" x2="490" y2="445" class="ok"/><text x="175" y="437">0x34 RequestDownload</text><line x1="110" y1="505" x2="490" y2="505" class="ok"/><text x="160" y="497">0x36 TransferData · Block Sequence</text><line x1="110" y1="565" x2="490" y2="565" class="ok"/><text x="155" y="557">0x37 RequestTransferExit</text><line x1="110" y1="625" x2="490" y2="625" class="ok"/><text x="125" y="617">0x31 RID_CheckProgrammingDependencies</text><rect x="430" y="652" width="500" height="62" class="box"/><text x="535" y="690" class="h">SHA-256 binary integrity comparison</text><line x1="490" y1="745" x2="110" y2="745" class="ok"/><text x="210" y="737">success → 0x11 ECUReset</text><rect x="430" y="785" width="500" height="140" class="fbox"/><text x="475" y="818" class="h">SHA-256 불일치</text><text x="475" y="850">Application valid 처리 금지</text><text x="475" y="878">EA_AppRestore() · Backup → Primary</text><text x="475" y="906">read-back / hash revalidation 후 정책 완료</text></g>
</svg>